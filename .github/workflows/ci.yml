# Continuous integration: every push and pull request.
name: CI

on:
  push:
    branches: [main, 'feature-**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (integration tests use embedded PostgreSQL, no Docker)
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (typecheck, unit tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: Infrastructure (Bicep build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile Bicep (fails on errors; linter warnings are printed)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for env in dev prod; do
            PG_ADMIN_PASSWORD=compile-only az bicep build-params --file "infra/env/$env.bicepparam" --stdout > /dev/null
          done

  e2e:
    name: Browser E2E + accessibility (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend (local profile, embedded PostgreSQL)
        working-directory: backend
        run: |
          nohup ./mvnw -B -q spring-boot:test-run > ../backend.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not start"; tail -100 ../backend.log; exit 1
      - name: Seed sample data
        run: node scripts/seed-sample-data.mjs
      - name: Install dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Dev server run
        working-directory: frontend
        run: npm run test:e2e
      - name: Production build, production topology (cross-origin API, real CSP)
        working-directory: frontend
        run: npm run test:e2e:cross-origin
      - name: Upload Playwright reports and backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            frontend/playwright-report/
            frontend/playwright-report-prod/
            backend.log
