# Local development dependencies only. Credentials are for a throwaway local container.
services:
  postgres:
    image: postgres:16-alpine
    container_name: songbook-postgres
    environment:
      POSTGRES_DB: songbook
      POSTGRES_USER: songbook
      POSTGRES_PASSWORD: songbook_local
    ports:
      - "5432:5432"
    volumes:
      - songbook-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songbook -d songbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local email catcher for verification/reset emails (Phase 3). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: songbook-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  songbook-pg:
