# Weekly dependency updates; security updates arrive as soon as advisories are published.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ['org.springframework*'] }
      azure: { patterns: ['com.azure*'] }
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      mui: { patterns: ['@mui/*', '@emotion/*'] }
      react: { patterns: ['react', 'react-dom', '@types/react*'] }
      test-tooling: { patterns: ['vitest', '@playwright/test', '@axe-core/*'] }
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
