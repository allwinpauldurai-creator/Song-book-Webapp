# Azure production environment. All values come from App Service settings / Key Vault references.
# No defaults on purpose: startup fails if something is missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  mail:
    # Azure Communication Services SMTP relay (smtp.azurecomm.net:587) requires STARTTLS.
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

songbook:
  frontend-base-url: ${SONGBOOK_FRONTEND_URL}
  cors:
    allowed-origins: ${SONGBOOK_CORS_ORIGINS}
  storage:
    provider: azure
    azure-endpoint: ${AZURE_STORAGE_ACCOUNT_ENDPOINT}
  security:
    jwt-secret: ${SONGBOOK_JWT_SECRET}
    ticket-secret: ${SONGBOOK_TICKET_SECRET}
    allow-generated-secrets: false
    refresh-cookie-secure: true
  mail:
    from: ${SONGBOOK_MAIL_FROM}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
