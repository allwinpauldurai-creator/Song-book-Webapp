# Azure production environment. All values come from App Service settings / Key Vault references.
# No defaults on purpose: startup fails if something is missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true

songbook:
  frontend-base-url: ${SONGBOOK_FRONTEND_URL}
  cors:
    allowed-origins: ${SONGBOOK_CORS_ORIGINS}
  storage:
    provider: azure
    azure-endpoint: ${AZURE_STORAGE_ACCOUNT_ENDPOINT}
  security:
    jwt-secret: ${SONGBOOK_JWT_SECRET}
    ticket-secret: ${SONGBOOK_TICKET_SECRET}
    allow-generated-secrets: false
    refresh-cookie-secure: true
  sms:
    # msg91 in production. "log" (codes in the log) also needs SONGBOOK_SMS_ALLOW_LOG=true, used on dev only.
    provider: ${SONGBOOK_SMS_PROVIDER}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
